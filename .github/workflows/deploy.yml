# 推送到 main 即构建并发布到 GitHub Pages（用户站根域）。
# 仓库名必须是 chengzhaolong.github.io，且 Settings → Pages → Source 选 GitHub Actions。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；新提交会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json 要求 >= 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 类型检查 + 英文站自检都放在部署前，坏提交不会上线
      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: i18n self-check
        run: npm run check:i18n

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
