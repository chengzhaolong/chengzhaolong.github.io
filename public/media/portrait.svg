<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="个人照片占位图">
  <defs>
    <linearGradient id="pt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17181e" />
      <stop offset="1" stop-color="#0a0a0d" />
    </linearGradient>
    <radialGradient id="pt-warm" cx="74%" cy="16%" r="62%">
      <stop offset="0" stop-color="#faba39" stop-opacity=".13" />
      <stop offset="1" stop-color="#faba39" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pt-cool" cx="24%" cy="80%" r="64%">
      <stop offset="0" stop-color="#21918c" stop-opacity=".22" />
      <stop offset="1" stop-color="#21918c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="800" fill="url(#pt-bg)" />
  <rect width="600" height="800" fill="url(#pt-warm)" />
  <rect width="600" height="800" fill="url(#pt-cool)" />

  <!-- 头像轮廓：替换成真实照片后自然消失 -->
  <g fill="#ffffff" fill-opacity=".085">
    <circle cx="300" cy="318" r="94" />
    <path d="M300 426c106 0 186 68 198 160l6 46H96l6-46c12-92 92-160 198-160z" />
  </g>

  <rect x=".5" y=".5" width="599" height="799" fill="none" stroke="#ffffff" stroke-opacity=".12" />
</svg>
