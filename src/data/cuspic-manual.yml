        summary: Column widths and usage for /NODE /GRNOD /SURF/SEG /BRICK /SHELL /MPMCEL /FUNCT /TETRA4.
        keywords: [/NODE, /BRICK, /MPMCEL]
      - no: '6'
        title: Material and property cards
        page: 28
        summary: How /MAT /EOS /HEAT/MAT /PROP /PART relate, and what the constitutive, equation-of-state and element-property parameters mean.
        keywords: [Johnson-Cook, Gruneisen, /PROP]
      - no: '7'
        title: Boundary and load cards
        page: 39
        summary: Common conventions for /BCS /BCR /CLOAD /GRAV /IMPDISP /IMPROTA /INIVEL /INITEMP and three more cards.
        keywords: [/BCS, /CLOAD, Initial conditions]
      - no: '8'
        title: MPM cards
        page: 47
        summary: /MPMGRID /MPMINFLOW /MPMCONTACT /MPMBOXBCS /MPMWALLBCS /MPMVELBCS — background grid, inflow and boundaries.
