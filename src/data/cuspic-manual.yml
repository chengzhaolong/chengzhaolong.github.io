      - no: A
        title: Keyword index
        page: 68
        summary: Card-to-chapter lookup table — search it on demand instead of reading cover to cover.
        keywords: [Index]
      - no: B
        title: Column-width reference
        page: 70
        summary: Column widths for every card under the fixed-column format, to copy from when writing an input file by hand.
