  # 首屏一句话（同时也是 meta description 的一部分，写"做什么"而不是口号）
  tagline_zh: 大变形非线性热力耦合求解器算法研究及软件开发
  tagline_en: Research and Software Development of Large Deformation Nonlinear Thermo-Mechanical Coupled Solver Algorithm.

  intro_zh: |-
    我的研究方向是热力耦合有限元-无网格算法、接触算法及其高性能计算实现。
    我开发了CUSPIC (Coupled Unified Solver with PIC-FEM) 高性能显式动力求解器, 
    能够基于GPU实现极端大变形非线性热力耦合问题的高效求解。
    并以CUSPIC为核心设计了CUSPER CuttingLab 软件, 用于机械加工工艺物理仿真及工艺优化。
    求解器和软件功能还在持续完善中, 希望和大家一起交流学习, 探索 CAE 技术赋能工业的更多可能。

  # 英文首页简介：与 intro_zh 逐句对应，不要在这里另写一份扩写版
  intro_en: |-
    My research covers thermo-mechanical finite element–meshfree algorithms, contact algorithms and their high-performance implementations.
    I develop CUSPIC (Coupled Unified Solver with PIC-FEM), a high-performance explicit dynamics solver that solves extreme large-deformation, non-linear thermo-mechanical problems efficiently on GPUs.
    Around CUSPIC I designed the CUSPER CuttingLab application for physical simulation and optimisation of machining processes.
    Solver and application are both still being improved — I am glad to exchange ideas and to explore more ways CAE technology can serve industry.

  # 兴趣标签：英文页用 interests_en（逐条对应，缺了会漏中文）
  interests:
    - 大变形热力耦合
    - FEM–MPM耦合
    - 高性能计算 / GPU并行计算
    - 热力接触与摩擦
    - 热流固耦合问题
    - 金属切削加工仿真
  interests_en:
    - Large-deformation thermo-mechanical coupling
    - FEM–MPM coupling
    - High-performance / GPU computing
    - Thermo-mechanical contact and friction
    - Thermo-hydro-mechanical coupling
    - Metal cutting simulation

