  # 首屏一句话（同时也是 meta description 的一部分，写"做什么"而不是口号）
  tagline_zh: 用有限元与物质点法耦合求解大变形、强热力耦合的金属切削过程，并做到 GPU 上跑得动工程尺度的算例。
  tagline_en: Large-deformation thermo-mechanical cutting — solved accurately and fast.

  intro_zh: |-
    我是一名计算力学方向直博生。研究围绕大变形、强非线性、强热力耦合的金属切削过程展开：用有限元（FEM）描述工件与刀具的连续变形和热传导，用物质点法（MPM）处理切屑分离与极端变形，通过 FEM–MPM 耦合算法与 GPU 并行，把工业尺度的切削仿真做到可用的精度与速度。为此我开发了求解器 cuspic 与仿真软件 Cusper CuttingLab。

  intro_en: |-
    I am a Ph.D. candidate in computational mechanics. My research targets metal cutting processes dominated by large deformation, strong non-linearity and thermo-mechanical coupling: the finite element method resolves the continuum response of workpiece and tool, the material point method handles chip separation and extreme distortion, and a FEM–MPM coupling scheme together with GPU parallelism makes industrial-scale cutting simulation both accurate and affordable. I build and maintain the cuspic solver and the Cusper CuttingLab application.

  interests:
    - 大变形热力耦合
    - FEM–MPM 耦合
    - 金属切削加工仿真
    - 高性能计算 / GPU 并行
    - 接触与摩擦
    - 材料本构与断裂

