- id: cuspic
  name: CUSPIC
  kicker: Solver
  tagline: 面向非线性大变形热力耦合的 FEM–MPM 高性能显式动力学求解器
  summary: |-
    CUSPIC（Coupled Unified Solver with PIC-FEM）是一款基于FEM-PIC耦合的高性能显式动力学求解器，适合处理大变形、强非线性热力耦合问题。
    CUSPIC能够基于GPU高性能并行计算，高效稳定的处理结构冲击、侵彻、切削等极端大变形热力耦合问题，为复杂大变形工程问题提供可靠的求解能力。
  version: v3.0.0
  status: 内部研发
  chips: [FEM–MPM 耦合, 热力耦合, GPU 并行]
  spec_line: FEM–MPM · 热力耦合 · 显式积分 · GPU 并行
  features:
    - title: FEM-PIC耦合计算
      text: 结构大变形和中等变形区域基于PIC和FEM分区离散，稳定处理极端变形问题
    - title: 非线性处理
      text: 支持多种非线性材料本构及热力接触算法、摩擦模型，适用于多种复杂工况
    - title: 并行计算
      text: 支持GPU及OpenMP并行计算，在桌面机器上高效处理大规模问题
    - title: 热力流多场耦合分析
      text: 支持热力流固耦合问题，适用于切削、冲击、自由表面流体冷却等多种复杂工况
    - title: 方便的前处理
      text: 输入文件格式部分继承Hypermesh rad格式，清晰的卡片式关键字方便集成LLM辅助建模
  specs:
    - k: 系统
      v: win64 / linux64
    - k: FEM 单元
      v: BRICK8R / BRICK8SRI / TETRA4 / B-T SHELL4
    - k: PIC 方法
      v: B-Spline MPM · FLIP-PIC · APIC / PolyPIC
    - k: 材料
      v: 线弹性 / Johnson-Cook/ Tanh-Johnson-Cook / Newtonian liquid / Drucker-Prager
    - k: 状态方程
      v: Gruneisen / Monaghan
    - k: 接触与界面
      v: NTS 罚接触 · FEM-FEM / FEM-MPM / MPM-MPM 三类热力绑定及有限滑移接触 · 高温摩擦界面软化 · 库伦摩擦 · 压力相关Tresca摩擦 · 压力相关接触热导 · 多场网格接触算法
    - k: 边界与载荷
      v: 指定位移 / 温度 / 热流 / 速度 / 力 / 转动 / 径向约束 / MPM 盒与墙边界；重力、初始速度条件
    - k: 并行
      v: OpenMP 多线程 / GPU 异构计算 (目前仅linux64支持该功能)
    - k: 输出
      v: VTU 二进制结果文件 + 终端进度 + 自动日志
  # 能力矩阵：/software 与 /software/cuspic 共用，一行一类，只写短语
  matrix:
    - k: 系统
      v: win64 / linux64
    - k: FEM 单元
      v: BRICK8R / BRICK8SRI / TETRA4 / B-T SHELL4
    - k: PIC 方法
      v: B-Spline MPM · FLIP-PIC · APIC / PolyPIC
    - k: 材料
      v: 线弹性 / Johnson-Cook/ Tanh-Johnson-Cook / Newtonian liquid / Drucker-Prager
    - k: 状态方程
      v: Gruneisen / Monaghan
    - k: 接触与界面
      v: NTS 罚接触 · FEM-FEM / FEM-MPM / MPM-MPM 三类热力绑定及有限滑移接触 · 高温摩擦界面软化 · 库伦摩擦 · 压力相关Tresca摩擦 · 压力相关接触热导 · 多场网格接触算法
    - k: 边界与载荷
      v: 指定位移 / 温度 / 热流 / 速度 / 力 / 转动 / 径向约束 / MPM 盒与墙边界；重力、初始速度条件
    - k: 并行
      v: OpenMP 多线程 / GPU 异构计算 (目前仅linux64支持该功能)
    - k: 输出
