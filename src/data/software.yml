- id: cuspic
  name: CUSPIC
  kicker: Solver
  tagline: 面向冲击动力学与大变形热力耦合的 FEM–MPM 高性能显式动力学求解器
  summary: |-
    CUSPIC（Coupled Unified Solver with PIC-FEM）把有限元与物质点法放进同一套显式时间推进框架：常规区域用单元求解，大变形与材料流动区域交给物质点并追踪其历史，两者可耦合、可接触。适合冲击侵彻、金属切削、高速成形这类网格会被撕开的问题。
  version: v3.0.0
  status: 内部研发
  chips: [FEM–MPM 耦合, 热力耦合, GPU 并行, 关键字驱动]
  spec_line: FEM–MPM · 热力耦合 · 显式积分 · GPU 并行
  features:
    - title: FEM 与 MPM 同模型
      text: 常规区域用单元、大变形区域用物质点，同一个模型里混用，避免网格畸变压垮计算。
    - title: 材料与状态方程
      text: Johnson-Cook（含失效）、JC-Tanh、Drucker-Prager 与牛顿流体，配 Gruneisen / Monaghan 状态方程。
    - title: 接触与热力绑定
      text: NTS 罚接触，FEM-FEM、FEM-MPM、MPM-MPM 三类热力绑定，摩擦生热与热传导一起算。
    - title: 全流程关键字驱动
      text: 网格、材料、边界、载荷到输出都由 .cusp 关键字卡片控制，一套输入文件即可复现算例。
    - title: 显式并行求解
      text: OpenMP 多线程为默认，Linux 版可开 GPU 加速；实际使用的硬件与线程数打印在启动摘要。
    - title: 结果直出 ParaView
      text: 按间隔输出 VTU 场数据（二进制 / ASCII），拖进 ParaView 就能看切屑与温度场的演化。
  specs:
    - k: 核心方法
      v: FEM–MPM 耦合，显式时间积分
    - k: 单元类型
      v: 六面体（8 节点）/ TET4 / 四边形壳 / B-T 壳
    - k: 材料与状态方程
      v: Johnson-Cook（含失效）· JC-Tanh · Drucker-Prager；Gruneisen / Monaghan
    - k: 接触
      v: NTS 罚接触；FEM-FEM / FEM-MPM / MPM-MPM 热力绑定
    - k: 并行
      v: OpenMP 多线程；GPU 加速（Linux 版）
    - k: 实现语言
      v: C++ / CUDA
    - k: 输出
      v: VTU 场数据（Binary / ASCII）+ 运行日志
    - k: 运行平台
      v: Linux（CPU + GPU）/ Windows（仅 CPU）
  # 能力矩阵：/software 与 /software/cuspic 共用，一行一类，只写短语
  matrix:
    - k: FEM 单元
      v: 六面体 / TET4 / 四边形壳 / B-T 壳；减缩积分配沙漏控制
    - k: MPM 方法
      v: 二次 B 样条 · FLIP-PIC · APIC / PolyPIC；支持物质点流入
    - k: 材料
      v: 线弹性 / Johnson-Cook（含失效）/ JC-Tanh / 牛顿流体 / Drucker-Prager
    - k: 状态方程
      v: Gruneisen / Monaghan；热材料库支持温度场演化
    - k: 接触与界面
      v: NTS 罚接触；FEM-FEM / FEM-MPM / MPM-MPM 三类热力绑定
    - k: 边界与载荷
      v: 位移 / 速度 / 力 / 径向 / MPM 盒与墙边界；重力、初始条件
    - k: 并行
      v: OpenMP 多线程（受许可核心数限制）；Linux 版 GPU
    - k: 输出
      v: VTU 结果文件 + 终端进度 + 自动日志
  # 案例位：video 留空即显示「待替换」占位，后面补上 mp4 路径即可；
  #         第一条整行展示，其余两条并排
  cases:
    - title: 三维微铣削
      meta: 3D micro-milling · FEM–MPM
      caption: 工件用物质点、刀具有限元，NTS 罚接触；切屑成形、材料堆积与温度场同步演化。
      video: /media/videos/cut3d1.mp4
      poster: /media/videos/cut3d1.png
    - title: 高速冲击 / 侵彻
      meta: Impact · FEM–MPM
      caption: 金属靶板侵彻：单元畸变区自动转为物质点，不必手动删单元。
    - title: MPM 大变形流动
      meta: MPM inflow
      caption: 物质点流入算例：极端变形下的稳定推进。
  links:
    - label: 用户手册（PDF）
      href: /media/docs/cuspic-manual-v3.0.0.pdf
      variant: primary
      download: true
    - label: 邮件联系
      href: mailto:chengzhaolong@mail.dlut.edu.cn
      variant: ghost

- id: cuttinglab
  name: CUSPER CuttingLab
  kicker: Application
  tagline: 以 CUSPIC 为核心的金属切削加工仿真一体化软件
  summary: |-
    CUSPER CuttingLab 把「几何与材料准备 → 工艺参数设置 → 求解 → 结果分析」做成不写代码也能跑通的流程。面向切削工艺研究与小批量工艺试算：参数扫描、结果对比与图表输出都在界面里完成，不用再回头写前处理脚本。
  status: 即将开启试用
  chips: [一键求解, 参数扫描, 结果对比]
  spec_line: 几何–工艺–求解–后处理 · 工艺优化 · 切削力 · 刀具温度
  features:
    - title: 几何与材料
      text: 导入工件与刀具几何，建立材料本构（JC 类塑性、温度相关参数）与摩擦模型。
    - title: 工艺参数
      text: 切削速度、进给量、切深、刀尖几何与冷却条件集中设置，可保存成参数组批量提交。
    - title: 一键求解
      text: 内部调用 CUSPIC，自动完成背景网格与物质点布置、时间步控制与任务调度。
    - title: 结果后处理
      text: 应力 / 应变 / 温度云图、切屑形态演化、切削力与温度曲线，支持导出图与数据。
  specs:
    - k: 底层求解器
      v: CUSPIC v3.0.0（FEM–MPM）
    - k: 典型输出
      v: 云图 / 视频 / 力–位移曲线 / 温度曲线
    - k: 运行平台
      v: Windows / Linux（以内测版本为准）
    - k: 获取方式
      v: 邮件登记，试用开启后按登记顺序发放
  # 案例位：video / poster 留空即显示「待替换」占位
  cases:
    - title: 主界面与工艺参数
      meta: UI · Parameter setup
      caption: 界面截图或一段操作录屏。
    - title: 切削力与温度曲线
      meta: Result · Force / Temperature
      caption: 后处理曲线与云图。
    - title: 切屑形态演化
      meta: Result · Chip morphology
      caption: 多帧切屑演化对比。
  # 试用申请：open 改成 true 就自动从「即将开启」切换到「申请试用」文案
  application:
    open: false
    email: chengzhaolong@mail.dlut.edu.cn
    subject: CUSPER CuttingLab 试用申请
    lead: 试用面向切削工艺研究与教学，先开放小批量内测名额；开启后按登记顺序发放，并附一份上手指引与示例参数组。
    fields:
      - k: 用户名
        hint: 姓名或称呼
      - k: 单位
        hint: 学校 / 课题组 / 公司
      - k: 物理 MAC 地址
        hint: 如 00-1A-2B-3C-4D-5E
    extra_lines: [材料 / 工件, 切削工况（速度 / 进给 / 切深）, 关注的结果, 可用硬件（CPU / GPU）]
    note: 许可证按机器码签发，换机器、加卡或延期都要重新申请；虚拟网卡与随机 MAC 无法签发。
    mac_help:
      - Windows：命令提示符里 ipconfig /all →「物理地址」
      - Linux：ip link 或 cat /sys/class/net/*/address
      - macOS：ifconfig en0 | grep ether
  links:
    - label: 试用即将开启 ↓
      href: '#access'
      variant: primary
    - label: 工作流 ↓
      href: '#workflow'
      variant: ghost
