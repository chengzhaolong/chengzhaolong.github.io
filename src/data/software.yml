        hint: 学校 / 课题组 / 公司
      - k: 物理 MAC 地址
        hint: 如 00-1A-2B-3C-4D-5E
    extra_lines: [材料 / 工件, 切削工况（速度 / 进给 / 切深）, 关注的结果, 可用硬件（CPU / GPU）]
  links:
    - label: 试用即将开启 ↓
      href: '#access'
      variant: primary
    - label: 工作流 ↓
